  # Chiens
  "47666679":
    en: "Animals on a lead."
    nl: "Dieren aangelijnd."
  "4a4aaf49":
    en: "The route crosses private land and summer pastures. Dogs are not allowed, even on a lead."
    nl: "De route gaat door privéterrein en zomerweiden. Honden zijn niet toegestaan, ook niet aangelijnd."
  "03ead964":
    en: "Animals are not allowed, even on a lead: the route crosses private land and pastures, with livestock on the summer pastures."
    nl: "Dieren zijn niet toegestaan, ook niet aangelijnd: de route gaat door privéterrein en weiden, met vee op de zomerweiden."
  "5f5f7450":
    en: "Dogs on a lead are tolerated."
    nl: "Aangelijnde honden worden getolereerd."
  "b13a9ede":
    en: "Dogs are not allowed, even on a lead. Livestock on the summer pastures; the route crosses private land."
    nl: "Honden zijn niet toegestaan, ook niet aangelijnd. Vee op de zomerweiden; de route gaat door privéterrein."
  # Topoguides et cartes
  "324b93e1":
    en: "Route card in the guidebook \"Explorer le Haut Cantal\", on sale for €10 at the Destination Haut Cantal tourist office in Riom-ès-Montagnes."
    nl: "Routekaart in de gids \"Explorer le Haut Cantal\", te koop voor € 10 bij het toeristenbureau Destination Haut Cantal in Riom-ès-Montagnes."
  "2a5b2513":
    en: "A leaflet showing all the marker posts is available at the tourist office and at Menet town hall."
    nl: "Een folder met alle markeringspaaltjes is verkrijgbaar bij het toeristenbureau en het gemeentehuis van Menet."
  "ca8ba8b3":
    en: "Route card in the guidebook \"Les Chemins du Pays Gentiane\", on sale for €7 at the Destination Haut Cantal tourist office in Riom-ès-Montagnes."
    nl: "Routekaart in de gids \"Les Chemins du Pays Gentiane\", te koop voor € 7 bij het toeristenbureau Destination Haut Cantal in Riom-ès-Montagnes."
  "da021ddf":
    en: "Leaflet available at the Destination Haut Cantal tourist office."
    nl: "Folder verkrijgbaar bij het toeristenbureau Destination Haut Cantal."
  "755a3312":
