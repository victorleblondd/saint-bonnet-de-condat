  # Passages délicats
  "0816a32f":
    en: "The descent after the summit of the Puy Mary."
    nl: "De afdaling na de top van de Puy Mary."
  "4338d6a9":
    en: "The descent from the Puy Mary, Brèche de Rolland."
    nl: "De afdaling van de Puy Mary, Brèche de Rolland."
  "1cbc03fc":
    en: "Crossing summer pastures: livestock present."
    nl: "Doorsteek van zomerweiden: er loopt vee."
  # Conseils
  "eb9f624b":
    en: "Fairly easy by mountain bike. Prefer the track between points 6 and 7."
    nl: "Vrij makkelijk met de mountainbike. Neem tussen punt 6 en 7 bij voorkeur de onverharde weg."
  "e4f7f4e5":
    en: |-
      For your safety, always take a bottle of water, a hat, warm and waterproof clothing, and wear suitable walking shoes.
      Depending on the weather, some routes are not recommended in bad weather (fog), or are impassable or even closed in winter.
      Bivouacking: during summer time, tents must be pitched after 8 pm and taken down before 8 am. Bivouacs must be at the edge of a forest, never on slopes, craters or volcano summits, unless signs on site say otherwise. Ask the permission of whoever owns or uses the land.
      Open fires are allowed in specially equipped areas. Otherwise, all fires are forbidden within 200 m of a forest edge, wood or forest, or under a prefectoral order.
      Portable gas stoves are, however, tolerated, used as safely as possible (stable, away from flammable material…).
      Stay on the waymarked paths. Respect private property.
      Bring a rubbish bag for picnic and snack waste, and use the bins found in almost every car park.
      Do not disturb wildlife.
      Do not pick flowers: many of them are protected (even those that look very ordinary or common).
    nl: |-
      Neem voor uw veiligheid altijd een fles water, een hoed, warme en regenwerende kleding mee en draag geschikte wandelschoenen.
      Afhankelijk van het weer worden sommige routes bij slecht weer (mist) afgeraden, of zijn ze in de winter onbegaanbaar of zelfs verboden.
      Wildkamperen (bivak): tijdens de zomertijd moet de tent na 20.00 uur worden opgezet en vóór 8.00 uur worden afgebroken. De bivakplek moet aan een bosrand liggen, nooit op hellingen, kraters of vulkaantoppen, tenzij ter plaatse anders aangegeven. Vraag toestemming aan wie het terrein gebruikt of bezit.
      Open vuur is toegestaan op speciaal ingerichte plaatsen. Anders is elk vuur verboden binnen 200 m van een bosrand, een bosje of een bos, of wanneer een prefectoraal besluit het verbiedt.
      Een draagbaar gasstel wordt wel getolereerd, zo veilig mogelijk gebruikt (stabiel, uit de buurt van brandbaar materiaal…).
      Blijf op de gemarkeerde paden. Respecteer privé-eigendom.
      Neem een vuilniszak mee voor het afval van picknick of tussendoortje, en gebruik de containers die op bijna alle parkeerplaatsen staan.
      Verstoor de wilde dieren niet.
      Pluk geen bloemen: veel ervan zijn beschermd (ook die er heel gewoon uitzien).
  "0e6447fd":
    en: |-
      The route is within the reach of any good hiker used to walking in mountainous terrain and carrying a rucksack.
      It takes 5 to 10 days, depending on the loops chosen.
      For your safety, always take water, a hat, warm and waterproof clothing, and wear suitable walking shoes.
    nl: |-
      De route is haalbaar voor elke goede wandelaar die gewend is aan lopen in bergachtig terrein en het dragen van een rugzak.
      De duur varieert van 5 tot 10 dagen, afhankelijk van de gekozen lussen.
      Neem voor uw veiligheid altijd water, een hoed, warme en regenwerende kleding mee en draag geschikte wandelschoenen.
  # Points forts
  "19a1e16d":
    en: |-
      - High summer-pasture plateaus of the Massif Central.
      - Views of the Chaîne des Puys, the Sancy massif and the Monts du Cantal.
      - The Joran and Artout glacial cirques.
      - The Sagnes nature reserve and the La Godivelle peat bog.
      - The Signal du Luguet (1,551 m).
      - The rich heritage of the Cézallier.
      - Village architecture, churches, fountains, wash houses, bread ovens and vernacular heritage.
      - Orthodox monastery (at La Traverse).
    nl: |-
      - Hoge zomerweideplateaus van het Centraal Massief.
      - Uitzicht op de Chaîne des Puys, het Sancymassief en de Monts du Cantal.
      - De gletsjerketels van Le Joran en Artout.
      - Het natuurreservaat van Les Sagnes en het hoogveen van La Godivelle.
      - De Signal du Luguet (1551 m).
      - Het rijke erfgoed van de Cézallier.
      - De architectuur van de dorpen, kerken, fonteinen, wasplaatsen, broodovens en het kleine erfgoed.
      - Orthodox klooster (bij La Traverse).

