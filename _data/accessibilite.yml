non_applicables_detail: "Les critères non applicables portent sur des contenus que le site ne comporte pas : cadres, contenus audio ou vidéo, CAPTCHA, images complexes, images texte ou images légendées, tableaux complexes ou de mise en forme, passages en langue étrangère, champs de formulaire, moteur de recherche, raccourcis clavier, contenus apparaissant au survol, limites de temps, effets de flash, gestes complexes et commandes par mouvement de l'appareil."

environnement: "Les vérifications ont été réalisées avec le navigateur Chromium 141, sur ordinateur (1 280 pixels de large) et en affichage de téléphone simulé (375 et 320 pixels de large), en thème clair et en thème sombre, avec un zoom à 200 % et un espacement du texte agrandi. La restitution des contenus a été contrôlée dans l'arbre d'accessibilité du navigateur. Aucun test n'a été réalisé avec un lecteur d'écran."

