  resume: "La mairie récupère toute l'année vos cartouches d'encre usagées. Elles sont remises à l'école de Lugarde pour être recyclées et aider à financer les activités des enfants."
  pdf: "2026-10-06-cartouches-d-encre.pdf"
  texte: |
    <p><strong>Ne jetez plus vos cartouches d'encre !</strong> La mairie de Saint-Bonnet-de-Condat les récupère toute l'année afin de leur donner une seconde vie.</p>
