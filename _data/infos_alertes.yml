# =====================================================================
#  INFOS & ALERTES DE LA MAIRIE
#  La publication la plus récente se place TOUT EN HAUT de la liste.
#
#  Ajouter une actualité en PDF :
#    1. Déposer le fichier PDF dans le dossier  documents/infos-alertes/
#       Nom conseillé : AAAA-MM-JJ-sujet-court.pdf  (sans accents ni espaces)
#    2. Copier le modèle ci-dessous tout en haut de la liste, puis le remplir.
#
#  - date: "AAAA-MM-JJ"               date de l'actualité
#    heure: "HH:MM"                   facultatif
#    type: alerte                     alerte (rouge) ou info (bleu)
#    theme: eau                       eau, travaux, vie (services et vie locale)
#    titre: "Titre de l'actualité"
#    resume: "Une ou deux phrases qui disent l'essentiel."
#    pdf: "AAAA-MM-JJ-sujet-court.pdf"    nom exact du fichier déposé
#    bandeau_jusquau: "AAAA-MM-JJ"    facultatif : bandeau rouge sur l'accueil
#                                     jusqu'à cette date incluse (alertes)
#    texte: |                         texte complet de l'actualité
#      <p>…</p>
#    en:                              traduction anglaise (pages /en/)
#      titre: "…"
#      resume: "…"
#      texte: |
#        <p>…</p>
#    nl:                              traduction néerlandaise (pages /nl/), même modèle
#
#  Sans rubrique en: ou nl:, l'actualité s'affiche en français sur les pages
#  anglaises et néerlandaises, avec la mention « In French » / « In het Frans ».
#  Ajouter ou corriger une traduction plus tard ne renvoie pas de notification
#  (la notification dépend de la date et du PDF ou du titre français), mais
#  écrire quand même [sans notification] dans le message du commit.
#
#  Champ « texte » : le texte complet de l'actualité, affiché sous le bouton
#  « Afficher le texte de l'actualité ». À remplir pour chaque PDF : les
#  affiches en image ne sont pas lisibles par les lecteurs d'écran
#  (accessibilité). Il doit reprendre toutes les informations de l'affiche.
#  Les actualités sans PDF affichent ce texte.
# =====================================================================

- date: "2026-10-24"
  type: info
  theme: vie
  titre: "PLUi : recensement des bâtiments du territoire"
  resume: "La commune recense les bâtiments agricoles susceptibles de changer de destination (granges, étables…). Les propriétaires concernés recevront prochainement un courrier de la mairie."
  pdf: "2026-10-24-plui-recensement-batiments-agricoles.pdf"
  texte: |
    <p><strong>PLUi – Plan local d'urbanisme intercommunal</strong><br><strong>Recensement des bâtiments du territoire</strong></p>
    <p>Dans le cadre de l'élaboration du PLUi, la commune de Saint-Bonnet-de-Condat réalise actuellement un recensement des bâtiments agricoles susceptibles de changer de destination (granges, étables, anciens bâtiments agricoles…).</p>
    <p><strong>Les personnes concernées vont recevoir prochainement un courrier de la mairie</strong>, accompagné d'un coupon-réponse, afin de vérifier les informations dont nous disposons.</p>
    <p>Si vous pensez posséder un bâtiment qui pourrait être concerné, mais que vous n'avez pas reçu de courrier, <strong>n'hésitez surtout pas à vous faire connaître auprès de la mairie !</strong></p>
    <p>Vous pouvez contacter la mairie aux horaires d'ouverture (<a href="tel:+33471784164">04&nbsp;71&nbsp;78&nbsp;41&nbsp;64</a>) ou par mail (<a href="mailto:mairie.stbonnetdecondat@orange.fr">mairie.stbonnetdecondat@<wbr>orange.fr</a>).</p>
    <p>Merci à tous pour votre participation et votre collaboration.<br>La municipalité de Saint-Bonnet-de-Condat</p>
  en:
    titre: "PLUi local plan: survey of buildings in the area"
    resume: "The municipality is surveying farm buildings that could change use (barns, cowsheds…). The owners concerned will soon receive a letter from the town hall."
    texte: |
      <p><strong>PLUi – Inter-municipal local urban plan (<span lang="fr">Plan local d'urbanisme intercommunal</span>)</strong><br><strong>Survey of buildings in the area</strong></p>
      <p>As part of drawing up the PLUi, the municipality of Saint-Bonnet-de-Condat is currently surveying farm buildings that could change use (barns, cowsheds, old farm buildings…).</p>
      <p><strong>The people concerned will soon receive a letter from the town hall</strong>, with a reply slip, so that we can check the information we hold.</p>
      <p>If you think you own a building that could be concerned but you have not received a letter, <strong>please do let the town hall know!</strong></p>
      <p>You can contact the town hall during opening hours (<a href="tel:+33471784164">04&nbsp;71&nbsp;78&nbsp;41&nbsp;64</a>) or by email (<a href="mailto:mairie.stbonnetdecondat@orange.fr">mairie.stbonnetdecondat@<wbr>orange.fr</a>).</p>
      <p>Thank you all for your participation and cooperation.<br>The municipality of Saint-Bonnet-de-Condat</p>
  nl:
    titre: "PLUi: inventarisatie van de gebouwen in de gemeente"
    resume: "De gemeente inventariseert landbouwgebouwen die een andere bestemming zouden kunnen krijgen (schuren, stallen…). De betrokken eigenaren krijgen binnenkort een brief van het gemeentehuis."
    texte: |
      <p><strong>PLUi – Intergemeentelijk bestemmingsplan (<span lang="fr">Plan local d'urbanisme intercommunal</span>)</strong><br><strong>Inventarisatie van de gebouwen in de gemeente</strong></p>
      <p>In het kader van de opstelling van het PLUi inventariseert de gemeente Saint-Bonnet-de-Condat momenteel de landbouwgebouwen die een andere bestemming zouden kunnen krijgen (schuren, stallen, oude landbouwgebouwen…).</p>
      <p><strong>De betrokkenen krijgen binnenkort een brief van het gemeentehuis</strong>, met een antwoordstrook, om de gegevens waarover wij beschikken te controleren.</p>
      <p>Denkt u dat u een gebouw bezit dat in aanmerking kan komen, maar hebt u geen brief ontvangen? <strong>Meld u dan zeker bij het gemeentehuis!</strong></p>
      <p>U kunt het gemeentehuis tijdens de openingstijden bellen (<a href="tel:+33471784164">04&nbsp;71&nbsp;78&nbsp;41&nbsp;64</a>) of mailen (<a href="mailto:mairie.stbonnetdecondat@orange.fr">mairie.stbonnetdecondat@<wbr>orange.fr</a>).</p>
      <p>Iedereen bedankt voor de deelname en de medewerking.<br>Het gemeentebestuur van Saint-Bonnet-de-Condat</p>

- date: "2026-10-21"
  type: info
  theme: vie
  titre: "Éclairage public : votre avis nous intéresse !"
  resume: "Permanence de Nathalie MÉTAYER, 2ᵉ adjointe au maire, jeudi 29 octobre 2026 de 9 h à 12 h à la mairie. Venez échanger et donner votre avis sur l'éclairage public dans notre commune."
  pdf: "2026-10-21-permanence-eclairage-public.pdf"
  texte: |
    <p><strong>Éclairage public : votre avis nous intéresse !</strong></p>
    <p>Permanence de Nathalie MÉTAYER, 2<sup>e</sup> adjointe au maire<br><strong>Jeudi 29 octobre 2026</strong><br>De 9 h à 12 h<br>Mairie de Saint-Bonnet-de-Condat</p>
    <p>Dans le cadre d'une réflexion sur l'éclairage public de notre commune, Nathalie vous propose de venir échanger et donner votre avis.</p>
    <ul>
      <li>Trouvez-vous qu'il y a trop de lampadaires dans certains secteurs ?</li>
      <li>Au contraire, estimez-vous qu'il manque des points d'éclairage à certains endroits ?</li>
      <li>Avez-vous des remarques ou des suggestions pour améliorer l'éclairage public ?</li>
    </ul>
    <p>Cette permanence est l'occasion de faire entendre votre avis et de partager vos idées.</p>
    <p>Nous comptons sur votre participation pour réfléchir ensemble à un éclairage public adapté aux besoins de notre commune !</p>
  en:
    titre: "Street lighting: we want your views!"
    resume: "Drop-in session with Nathalie MÉTAYER, 2nd deputy mayor, on Thursday 29 October 2026 from 9:00 to 12:00 at the town hall. Come and share your views on street lighting in our municipality."
    texte: |
      <p><strong>Street lighting: we want your views!</strong></p>
      <p>Drop-in session with Nathalie MÉTAYER, 2nd deputy mayor<br><strong>Thursday 29 October 2026</strong><br>From 9:00 to 12:00<br>Saint-Bonnet-de-Condat town hall</p>
      <p>As part of a review of street lighting in our municipality, Nathalie invites you to come and talk with her and share your views.</p>
      <ul>
        <li>Do you think there are too many street lights in some areas?</li>
        <li>On the contrary, do you feel that lighting is missing in some places?</li>
        <li>Do you have comments or suggestions to improve street lighting?</li>
      </ul>
      <p>This drop-in session is a chance to make your voice heard and share your ideas.</p>
      <p>We are counting on your participation to think together about street lighting suited to the needs of our municipality!</p>
  nl:
    titre: "Straatverlichting: uw mening telt!"
    resume: "Spreekuur van Nathalie MÉTAYER, 2e wethouder, op donderdag 29 oktober 2026 van 9.00 tot 12.00 uur in het gemeentehuis. Kom uw mening geven over de straatverlichting in onze gemeente."
    texte: |
      <p><strong>Straatverlichting: uw mening telt!</strong></p>
      <p>Spreekuur van Nathalie MÉTAYER, 2e wethouder<br><strong>Donderdag 29 oktober 2026</strong><br>Van 9.00 tot 12.00 uur<br>Gemeentehuis van Saint-Bonnet-de-Condat</p>
      <p>Omdat we de straatverlichting in onze gemeente onder de loep nemen, nodigt Nathalie u uit om langs te komen en uw mening te geven.</p>
      <ul>
        <li>Vindt u dat er in sommige wijken te veel lantaarnpalen staan?</li>
        <li>Of vindt u juist dat er op sommige plekken verlichting ontbreekt?</li>
        <li>Hebt u opmerkingen of suggesties om de straatverlichting te verbeteren?</li>
      </ul>
      <p>Dit spreekuur is de gelegenheid om uw mening te laten horen en uw ideeën te delen.</p>
      <p>We rekenen op uw deelname om samen na te denken over straatverlichting die past bij de behoeften van onze gemeente!</p>

- date: "2026-10-18"
  type: info
  theme: vie
  titre: "Nouveauté à Saint-Bonnet-de-Condat : les ateliers à thème de NaturÉpure"
  resume: "NaturÉpure proposera des ateliers à thème à la salle polyvalente de la mairie, sur 7 semaines, à partir du 2 janvier 2027. Réunion d'information le mardi 3 novembre, à 10 h ou à 20 h."
  pdf: "2026-10-18-ateliers-naturepure.pdf"
  texte: |
    <p><strong>Nouveauté à Saint-Bonnet-de-Condat !</strong></p>
    <p>Nous avons le plaisir de vous informer que NaturÉpure proposera prochainement des ateliers à thème au sein de notre commune :</p>
    <ul>
      <li>yogathérapie ;</li>
      <li>biodécodage ;</li>
      <li>sophrologie ;</li>
      <li>écriture-thérapie reconstructive.</li>
    </ul>
    <p>Ces ateliers se dérouleront à la salle polyvalente de la mairie, sur une période de 7 semaines, à partir du 2 janvier.</p>
    <p>Que vous soyez de Saint-Bonnet-de-Condat ou d'ailleurs, ces ateliers sont ouverts à toutes et à tous ! Alors, n'hésitez pas à venir les découvrir et à partager un moment de bien-être et de convivialité !</p>
    <p><strong>Une réduction de 20 % sera accordée aux habitants de Saint-Bonnet-de-Condat</strong> souhaitant participer à l'un de ces ateliers !</p>
    <p>Vous vous demandez en quoi consistent ces ateliers, comment ils se déroulent ou ce qu'ils peuvent vous apporter ? Venez le découvrir lors de la <strong>réunion d'information du mardi 3 novembre, à 10 h ou à 20 h</strong>, à la salle polyvalente de la mairie !</p>
    <p>Ce sera l'occasion de découvrir les différentes activités proposées, de poser toutes vos questions et d'obtenir toutes les explications nécessaires, sans aucun engagement.</p>
    <p>L'inscription à cette réunion est fortement conseillée, afin de confirmer le maintien des deux horaires en fonction du nombre de participants.</p>
    <p>Renseignements : <a href="tel:+33471692361">04&nbsp;71&nbsp;69&nbsp;23&nbsp;61</a> / <a href="tel:+33745110335">07&nbsp;45&nbsp;11&nbsp;03&nbsp;35</a> – courriel : <a href="mailto:contact@naturepuredetox.fr">contact@<wbr>naturepuredetox.fr</a></p>
    <p>Pour découvrir davantage les activités de NaturÉpure : <a href="https://www.naturepuredetox.fr" rel="noopener">www.naturepuredetox.fr</a></p>
    <p>Vous trouverez ci-joint le flyer de présentation ainsi que les tarifs et horaires des différents ateliers. N'hésitez pas à partager l'information autour de vous !</p>
    <p><strong>Ateliers à thème sur 7 semaines</strong><br>Du 2 janvier au 21 février, 2 jours par semaine, à la salle polyvalente de la mairie de Saint-Bonnet-de-Condat :</p>
    <ul>
      <li><strong>yogathérapie</strong> : 70 €, 3 h par semaine (minimum 7 participants), le mercredi et le samedi de 8 h 30 à 10 h ;</li>
      <li><strong>biodécodage/sophrologie</strong> : 60 €, 3 h par semaine (minimum 7 participants), le mercredi et le samedi de 10 h à 11 h 30 ;</li>
      <li><strong>écriture-thérapie reconstructive</strong> : 50 €, 2 h par semaine (minimum 7 participants), le mercredi et le samedi de 11 h 30 à 12 h 30.</li>
    </ul>
    <p><strong>NaturÉpure</strong> – Ateliers Bien-Être, Détox, Randonnée et Jeûne Spontané® – Cézallier-Haut-Cantal</p>
    <p>Ateliers bien-être et stages à thème de 7 jours dans le Cézallier, au cœur du Parc naturel régional des Volcans d'Auvergne, au Manoir de La Maillonchère, par des encadrants qualifiés et expérimentés. Renforcez votre système immunitaire par le détox physique et mental.</p>
    <p>Nos stages à thème :</p>
    <ul>
      <li>la santé par l'équilibre acido-basique et catabolique ;</li>
      <li>les bases naturopathiques de l'alimentation et du détox ;</li>
      <li>yogathérapie et réflexoméditation ;</li>
      <li>à la rencontre de soi par le détox du mental et le biodécodage ;</li>
      <li>écriture-thérapie reconstructive ;</li>
      <li>khórosthérapie et musicothérapie.</li>
    </ul>
    <p>NaturÉpure® est membre de la NHA (National Health Association, USA) ainsi qu'adhérent de l'AMJ (Académie Médicale du Jeûne).</p>
    <p>Au bas du flyer : logos d'ifsh formations, de FitForLife Sciences Institute, d'un centre de formation au massage thaï (Thai Massage Training Center) et des chambres d'hôtes du Manoir de La Maillonchère (1898).</p>
  en:
    titre: "New in Saint-Bonnet-de-Condat: NaturÉpure's themed workshops"
    resume: "NaturÉpure will run themed workshops in the town hall's multi-purpose room, over 7 weeks from 2 January 2027. Information meeting on Tuesday 3 November, at 10:00 or 20:00."
    texte: |
      <p><strong>New in Saint-Bonnet-de-Condat!</strong></p>
      <p>We are pleased to announce that NaturÉpure will soon be running themed workshops in our municipality:</p>
      <ul>
        <li>yoga therapy;</li>
        <li>biodecoding;</li>
        <li>sophrology;</li>
        <li>reconstructive writing therapy.</li>
      </ul>
      <p>These workshops will take place in the town hall's multi-purpose room, over a period of 7 weeks, starting on 2 January.</p>
      <p>Whether you live in Saint-Bonnet-de-Condat or elsewhere, these workshops are open to everyone! So do come and discover them and share a moment of wellbeing and conviviality!</p>
      <p><strong>Residents of Saint-Bonnet-de-Condat will get a 20% discount</strong> if they wish to take part in one of these workshops!</p>
      <p>Wondering what these workshops involve, how they work or what they can do for you? Come and find out at the <strong>information meeting on Tuesday 3 November, at 10:00 or 20:00</strong>, in the town hall's multi-purpose room!</p>
      <p>It will be an opportunity to discover the different activities on offer, ask all your questions and get all the explanations you need, with no commitment.</p>
      <p>Registering for this meeting is strongly recommended, to confirm that both sessions will go ahead depending on the number of participants.</p>
      <p>Information: <a href="tel:+33471692361">04&nbsp;71&nbsp;69&nbsp;23&nbsp;61</a> / <a href="tel:+33745110335">07&nbsp;45&nbsp;11&nbsp;03&nbsp;35</a> – email: <a href="mailto:contact@naturepuredetox.fr">contact@<wbr>naturepuredetox.fr</a></p>
      <p>To find out more about NaturÉpure's activities: <a href="https://www.naturepuredetox.fr/home" rel="noopener" hreflang="en">www.naturepuredetox.fr</a></p>
      <p>The presentation flyer and the prices and times of the different workshops are attached. Please share this information!</p>
      <p><strong>Themed workshops over 7 weeks</strong><br>From 2 January to 21 February, 2 days a week, in the multi-purpose room of Saint-Bonnet-de-Condat town hall:</p>
      <ul>
        <li><strong>yoga therapy</strong>: €70, 3 hours a week (minimum 7 participants), Wednesday and Saturday from 8:30 to 10:00;</li>
        <li><strong>biodecoding/sophrology</strong>: €60, 3 hours a week (minimum 7 participants), Wednesday and Saturday from 10:00 to 11:30;</li>
        <li><strong>reconstructive writing therapy</strong>: €50, 2 hours a week (minimum 7 participants), Wednesday and Saturday from 11:30 to 12:30.</li>
      </ul>
      <p><strong>NaturÉpure</strong> – Wellbeing, Detox, Hiking and Spontaneous Fasting Workshops (<span lang="fr">Ateliers Bien-Être, Détox, Randonnée et Jeûne Spontané®</span>) – Cézallier-Haut-Cantal</p>
      <p>Wellbeing workshops and 7-day themed courses in the Cézallier, in the heart of the Volcans d'Auvergne Regional Nature Park, at the Manoir de La Maillonchère, led by qualified and experienced instructors. Strengthen your immune system with a physical and mental detox.</p>
      <p>Our themed courses:</p>
      <ul>
        <li>health through acid–base and catabolic balance;</li>
        <li>the naturopathic basics of diet and detox;</li>
        <li>yoga therapy and reflexo-meditation;</li>
        <li>discovering yourself through mental detox and biodecoding;</li>
        <li>reconstructive writing therapy;</li>
        <li>khórostherapy and music therapy.</li>
      </ul>
      <p>NaturÉpure® is a member of the NHA (National Health Association, USA) and of the AMJ (<span lang="fr">Académie Médicale du Jeûne</span>).</p>
      <p>At the bottom of the flyer: logos of ifsh formations, FitForLife Sciences Institute, a Thai massage training centre (Thai Massage Training Center) and the Manoir de La Maillonchère guest house (1898).</p>
  nl:
    titre: "Nieuw in Saint-Bonnet-de-Condat: de themaworkshops van NaturÉpure"
    resume: "NaturÉpure organiseert themaworkshops in de multifunctionele zaal van het gemeentehuis, 7 weken lang vanaf 2 januari 2027. Infobijeenkomst op dinsdag 3 november, om 10.00 of 20.00 uur."
    texte: |
      <p><strong>Nieuw in Saint-Bonnet-de-Condat!</strong></p>
      <p>Met plezier laten we u weten dat NaturÉpure binnenkort themaworkshops organiseert in onze gemeente:</p>
      <ul>
        <li>yogatherapie;</li>
        <li>biodecodering;</li>
        <li>sofrologie;</li>
        <li>reconstructieve schrijftherapie.</li>
      </ul>
      <p>De workshops vinden plaats in de multifunctionele zaal van het gemeentehuis, gedurende 7 weken, vanaf 2 januari.</p>
      <p>Of u nu in Saint-Bonnet-de-Condat woont of elders: deze workshops staan open voor iedereen! Kom ze dus ontdekken en geniet van een moment van welzijn en gezelligheid!</p>
      <p><strong>Inwoners van Saint-Bonnet-de-Condat krijgen 20% korting</strong> als ze aan een van deze workshops willen deelnemen!</p>
      <p>Benieuwd wat deze workshops inhouden, hoe ze verlopen of wat ze u kunnen bieden? Kom het ontdekken op de <strong>informatiebijeenkomst van dinsdag 3 november, om 10.00 of 20.00 uur</strong>, in de multifunctionele zaal van het gemeentehuis!</p>
      <p>Dat is de gelegenheid om de verschillende activiteiten te leren kennen, al uw vragen te stellen en alle uitleg te krijgen die u nodig hebt, zonder enige verplichting.</p>
      <p>Aanmelden voor deze bijeenkomst wordt sterk aangeraden, zodat kan worden bevestigd dat beide tijden doorgaan, afhankelijk van het aantal deelnemers.</p>
      <p>Inlichtingen: <a href="tel:+33471692361">04&nbsp;71&nbsp;69&nbsp;23&nbsp;61</a> / <a href="tel:+33745110335">07&nbsp;45&nbsp;11&nbsp;03&nbsp;35</a> – e-mail: <a href="mailto:contact@naturepuredetox.fr">contact@<wbr>naturepuredetox.fr</a></p>
      <p>Meer over de activiteiten van NaturÉpure: <a href="https://www.naturepuredetox.fr/home" rel="noopener" hreflang="en">www.naturepuredetox.fr</a> (in het Engels)</p>
      <p>In de bijlage vindt u de folder met de presentatie en de prijzen en tijden van de verschillende workshops. Deel de informatie gerust!</p>
      <p><strong>Themaworkshops gedurende 7 weken</strong><br>Van 2 januari tot 21 februari, 2 dagen per week, in de multifunctionele zaal van het gemeentehuis van Saint-Bonnet-de-Condat:</p>
      <ul>
        <li><strong>yogatherapie</strong>: € 70, 3 uur per week (minimaal 7 deelnemers), op woensdag en zaterdag van 8.30 tot 10.00 uur;</li>
        <li><strong>biodecodering/sofrologie</strong>: € 60, 3 uur per week (minimaal 7 deelnemers), op woensdag en zaterdag van 10.00 tot 11.30 uur;</li>
        <li><strong>reconstructieve schrijftherapie</strong>: € 50, 2 uur per week (minimaal 7 deelnemers), op woensdag en zaterdag van 11.30 tot 12.30 uur.</li>
      </ul>
      <p><strong>NaturÉpure</strong> – Workshops welzijn, detox, wandelen en spontaan vasten (<span lang="fr">Ateliers Bien-Être, Détox, Randonnée et Jeûne Spontané®</span>) – Cézallier-Haut-Cantal</p>
      <p>Welzijnsworkshops en themastages van 7 dagen in de Cézallier, in het hart van het regionaal natuurpark Volcans d'Auvergne, in het Manoir de La Maillonchère, onder leiding van gekwalificeerde en ervaren begeleiders. Versterk uw immuunsysteem met een fysieke en mentale detox.</p>
      <p>Onze themastages:</p>
      <ul>
        <li>gezondheid door het zuur-baseevenwicht en het katabole evenwicht;</li>
        <li>de naturopathische basis van voeding en detox;</li>
        <li>yogatherapie en reflexomeditatie;</li>
        <li>uzelf ontmoeten via mentale detox en biodecodering;</li>
        <li>reconstructieve schrijftherapie;</li>
        <li>khórostherapie en muziektherapie.</li>
      </ul>
      <p>NaturÉpure® is lid van de NHA (National Health Association, VS) en van de AMJ (<span lang="fr">Académie Médicale du Jeûne</span>).</p>
      <p>Onderaan de folder: logo's van ifsh formations, FitForLife Sciences Institute, een opleidingscentrum voor Thaise massage (Thai Massage Training Center) en de bed-and-breakfast van het Manoir de La Maillonchère (1898).</p>

- date: "2026-10-16"
  type: info
  theme: vie
  titre: "Élections municipales du 15 mars 2026 : le Conseil d'État confirme les résultats"
  resume: "Le 16 octobre 2026, le Conseil d'État a confirmé le jugement du tribunal administratif et rejeté la requête. Cette décision est définitive : les résultats du scrutin du 15 mars sont confirmés."
  pdf: "2026-10-16-elections-municipales-conseil-d-etat.pdf"
  texte: |
    <p><strong>Mairie de Saint-Bonnet-de-Condat – Information aux habitants</strong><br>Saint-Bonnet-de-Condat, le 16 octobre 2026</p>
    <p><strong>Objet : Élections municipales du 15 mars 2026 – le Conseil d’État confirme les résultats</strong></p>
    <p>Chères habitantes, chers habitants,</p>
    <p>Les résultats des élections municipales du 15 mars 2026 avaient fait l’objet d’un recours devant la justice administrative. Nous souhaitons vous informer de l’issue de cette procédure.</p>
    <p>Par un jugement du 29 mai 2026, le tribunal administratif de Clermont-Ferrand avait rejeté la protestation électorale. Ce jugement avait ensuite été contesté devant le Conseil d’État.</p>
    <p>Par une décision du 16 octobre 2026 (n° 516978), le Conseil d’État a confirmé ce jugement et rejeté la requête. Il a estimé que les griefs soulevés n’étaient pas fondés et n’a relevé aucun élément diffamatoire. Cette décision est définitive : les résultats du scrutin du 15 mars sont confirmés et la procédure est close.</p>
    <p>Former un recours est un droit que nous respectons pleinement : il fait partie des garanties de notre vie démocratique. La justice s’étant prononcée de manière définitive, le moment est venu de tourner la page.</p>
    <p>Notre engagement reste le même : agir pour Saint-Bonnet-de-Condat et pour tous ses habitants, quel qu’ait été le choix de chacun le 15 mars. Nous voulons poursuivre ce mandat dans un esprit d’écoute, de respect et de rassemblement.</p>
    <p>La mairie vous accueille aux horaires habituels et chaque élu reste à votre disposition pour échanger.</p>
    <p>Bien cordialement,<br>Sarah Chabrier</p>
  en:
    titre: "Municipal elections of 15 March 2026: the Council of State confirms the results"
    resume: "On 16 October 2026, the Council of State upheld the administrative court's ruling and dismissed the appeal. This decision is final: the results of the 15 March election are confirmed."
    texte: |
      <p><strong>Saint-Bonnet-de-Condat town hall – Information for residents</strong><br>Saint-Bonnet-de-Condat, 16 October 2026</p>
      <p><strong>Subject: Municipal elections of 15 March 2026 – the Council of State confirms the results</strong></p>
      <p>Dear residents,</p>
      <p>The results of the municipal elections of 15 March 2026 had been challenged before the administrative courts. We would like to inform you of the outcome of these proceedings.</p>
      <p>In a judgment of 29 May 2026, the Clermont-Ferrand Administrative Court had dismissed the electoral challenge. This judgment was then appealed before the Council of State (<span lang="fr">Conseil d'État</span>).</p>
      <p>In a decision of 16 October 2026 (no. 516978), the Council of State upheld this judgment and dismissed the appeal. It found that the complaints raised were unfounded and identified no defamatory element. This decision is final: the results of the 15 March election are confirmed and the proceedings are closed.</p>
      <p>Lodging an appeal is a right that we fully respect: it is one of the safeguards of our democratic life. Now that the courts have given their final ruling, the time has come to turn the page.</p>
      <p>Our commitment remains the same: to act for Saint-Bonnet-de-Condat and for all its residents, whatever choice each person made on 15 March. We want to continue this term of office in a spirit of listening, respect and unity.</p>
      <p>The town hall welcomes you during its usual opening hours and every councillor remains available to talk with you.</p>
      <p>Kind regards,<br>Sarah Chabrier</p>
  nl:
    titre: "Gemeenteraadsverkiezingen van 15 maart 2026: de Raad van State bevestigt de uitslag"
    resume: "Op 16 oktober 2026 heeft de Raad van State het vonnis van de administratieve rechtbank bevestigd en het beroep verworpen. Deze beslissing is definitief: de uitslag van 15 maart is bevestigd."
    texte: |
      <p><strong>Gemeentehuis van Saint-Bonnet-de-Condat – Informatie voor de inwoners</strong><br>Saint-Bonnet-de-Condat, 16 oktober 2026</p>
      <p><strong>Betreft: Gemeenteraadsverkiezingen van 15 maart 2026 – de Raad van State bevestigt de uitslag</strong></p>
      <p>Beste inwoners,</p>
      <p>Tegen de uitslag van de gemeenteraadsverkiezingen van 15 maart 2026 was beroep ingesteld bij de administratieve rechter. Wij willen u informeren over de afloop van deze procedure.</p>
      <p>Bij vonnis van 29 mei 2026 had de administratieve rechtbank van Clermont-Ferrand het verkiezingsbezwaar afgewezen. Tegen dit vonnis was vervolgens beroep ingesteld bij de Raad van State (<span lang="fr">Conseil d'État</span>).</p>
      <p>Bij beslissing van 16 oktober 2026 (nr. 516978) heeft de Raad van State dit vonnis bevestigd en het beroep verworpen. Hij oordeelde dat de aangevoerde bezwaren ongegrond waren en stelde geen enkel lasterlijk element vast. Deze beslissing is definitief: de uitslag van de verkiezingen van 15 maart is bevestigd en de procedure is afgesloten.</p>
      <p>Beroep instellen is een recht dat wij volledig respecteren: het hoort bij de waarborgen van ons democratisch bestel. Nu de rechter definitief heeft beslist, is het tijd om de bladzijde om te slaan.</p>
      <p>Onze inzet blijft dezelfde: ons inzetten voor Saint-Bonnet-de-Condat en voor al zijn inwoners, wat ieders keuze op 15 maart ook was. We willen dit mandaat voortzetten in een geest van luisterbereidheid, respect en verbondenheid.</p>
      <p>Het gemeentehuis ontvangt u op de gewone openingstijden en elk raadslid blijft beschikbaar voor een gesprek.</p>
      <p>Met vriendelijke groet,<br>Sarah Chabrier</p>

