  resume: "La fuite sur le réseau du château d'eau de Laurus est localisée et sera réparée demain. Les habitants du bourg sont invités à réduire au maximum leur consommation."
  texte: |
    <p>La fuite sur le réseau du château d'eau de Laurus a été localisée. <strong>Elle ne pourra malheureusement être réparée que demain.</strong></p>
    <p>En attendant, nous demandons à tous les habitants du bourg de réduire au maximum leur consommation d'eau aujourd'hui. Cette vigilance est essentielle pour permettre au château d'eau de retrouver un niveau suffisant, et aux habitants situés sur la conduite entre la mairie et le Lessard de retrouver l'eau le plus rapidement possible dès que la fuite sera réparée.</p>
    <p>Chaque économie d'eau compte. Merci à tous pour votre compréhension et votre coopération.</p>

