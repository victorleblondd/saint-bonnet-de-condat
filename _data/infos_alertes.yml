  titre: "Coupure du réseau du château d'eau du Chancel"
  resume: "Le réseau alimenté par le château d'eau du Chancel est fermé ce soir à partir de 20 h. Remise en service prévue demain à partir de 8 h 30."
  texte: |
    <p>Le réseau alimenté par le château d'eau du Chancel sera fermé ce soir à partir de 20 h. Nous vous demandons d'anticiper vos besoins en eau avant la coupure.</p>
    <p><strong>La remise en service est prévue demain à partir de 8 h 30.</strong></p>
    <p>Le château d'eau ne remontant pas suffisamment, nous vous tiendrons informés afin de vous préciser si cette fermeture devra être renouvelée les prochains jours ou si elle restera exceptionnelle.</p>
    <p>Merci à tous pour votre compréhension et votre vigilance.</p>

- date: "2026-09-16"
  heure: "14:35"
  type: alerte
  theme: eau
  titre: "Coupure d'eau et travaux sur le réseau"
  resume: "Les coupures nocturnes sont maintenues. Ce soir, l'eau est coupée dès 21 h ; remise en eau demain après 9 h, une fois les travaux réalisés."
  texte: |
    <p>Suite à la fermeture de l'eau durant la nuit dernière, nous avons constaté que le niveau du château d'eau est bien remonté. À l'inverse, lorsque l'alimentation reste ouverte durant la nuit, le niveau ne remonte pas, ce qui laisse apparaître une consommation d'eau particulièrement importante pendant les heures nocturnes.</p>
    <p>Afin de préserver les réserves et de poursuivre nos recherches, les coupures nocturnes vont donc être maintenues.</p>
    <p><strong>Exceptionnellement ce soir, l'eau sera coupée à partir de 21 h.</strong> Des travaux étant programmés demain matin de bonne heure, la remise en eau n'interviendra qu'après 9 h, une fois les travaux réalisés.</p>
    <p>Nous vous tiendrons informés de la suite des opérations. Nous invitons une nouvelle fois chacun à faire preuve de la plus grande vigilance et à limiter au maximum sa consommation d'eau, afin de préserver les réserves disponibles.</p>
    <p>Merci à tous pour votre compréhension et votre coopération.</p>

- date: "2026-09-15"
  heure: "16:32"
  type: alerte
  theme: eau
  titre: "Coupures d'eau nocturnes – château d'eau de Laurus"
  resume: "En raison d'une baisse très rapide du niveau du château d'eau de Laurus, l'eau est coupée chaque nuit de 20 h à 7 h jusqu'au retour à une situation normale."
  texte: |
    <p><strong>Communiqué officiel – restriction temporaire de l'alimentation en eau.</strong></p>
    <p>En raison d'une baisse très importante et particulièrement rapide du niveau du château d'eau de Laurus, la commune est contrainte de mettre en place des coupures nocturnes d'alimentation en eau.</p>
    <p><strong>À compter de ce soir, l'eau sera coupée à partir de 20 h et remise en service à 7 h le lendemain matin.</strong> Cette mesure sera reconduite chaque nuit, jusqu'au retour à une situation normale, afin d'éviter la vidange complète du château d'eau et de préserver au maximum les réserves disponibles.</p>
    <p>Nous demandons à l'ensemble des usagers concernés de prendre toutes les dispositions nécessaires avant 20 h et d'anticiper leurs besoins en eau pour la nuit. Dans le contexte actuel, toute consommation non indispensable doit impérativement être évitée.</p>
    <p>La commune remercie chacun pour sa compréhension, sa vigilance et le strict respect de ces consignes.</p>

- date: "2026-09-15"
  type: info
  theme: eau
  titre: "Rappel aux agriculteurs : consommation d'eau"
  resume: "Consommation au strict nécessaire, abreuvement compris. Il est interdit de remplir des cuves au réseau communal ; le point d'eau du Frayssinet reste à disposition."
  texte: |
    <p>Compte tenu de la situation actuelle sur le réseau d'eau, nous rappelons qu'il est <strong>indispensable</strong> que chacun <strong>limite au strict nécessaire</strong> sa consommation, y compris pour l'abreuvement des animaux.</p>
    <p><strong>Il est strictement interdit de remplir des cuves avec l'eau provenant du réseau communal.</strong> Pour vos besoins, le point d'eau du Frayssinet reste à votre disposition.</p>
    <p>Des rondes de surveillance et des contrôles seront effectués. En cas d'abus ou de non-respect de ces consignes, la commune se verra dans l'obligation de prendre les mesures nécessaires et, le cas échéant, de sanctionner les comportements constatés.</p>
    <p>Merci à chacun de faire preuve de responsabilité afin de préserver au maximum les réserves d'eau.</p>

- date: "2026-09-13"
  type: info
  theme: eau
  titre: "Fuite d'eau : merci de limiter votre consommation"
  resume: "La fuite sur le réseau du château d'eau de Laurus est localisée et sera réparée demain. Les habitants du bourg sont invités à réduire au maximum leur consommation."
  texte: |
    <p>La fuite sur le réseau du château d'eau de Laurus a été localisée. <strong>Elle ne pourra malheureusement être réparée que demain.</strong></p>
    <p>En attendant, nous demandons à tous les habitants du bourg de réduire au maximum leur consommation d'eau aujourd'hui. Cette vigilance est essentielle pour permettre au château d'eau de retrouver un niveau suffisant, et aux habitants situés sur la conduite entre la mairie et le Lessard de retrouver l'eau le plus rapidement possible dès que la fuite sera réparée.</p>
    <p>Chaque économie d'eau compte. Merci à tous pour votre compréhension et votre coopération.</p>

- date: "2026-09-12"
  type: info
  theme: eau
  titre: "Fuite sur le château d'eau de Laurus"
  resume: "Une fuite fait fortement baisser le niveau du château d'eau de Laurus. Intervention cet après-midi ; des coupures d'eau sont possibles."
  texte: |
    <p><strong>Alerte eau – information importante pour les habitants.</strong> Une fuite a été constatée sur le château d'eau de Laurus. Le niveau d'eau baisse fortement et le réseau est actuellement perturbé.</p>
    <p>Tous les habitants du bourg et ceux desservis par Laurus sont invités à faire très attention à leur consommation d'eau et à la limiter au maximum.</p>
    <p>Des personnes vont intervenir sur le réseau cet après-midi afin de rechercher la fuite et de rétablir le réseau à la normale le plus rapidement possible. <strong>Des coupures d'eau peuvent avoir lieu le temps de l'intervention.</strong></p>
    <p>Merci à tous pour votre patience, votre vigilance et votre solidarité.</p>

