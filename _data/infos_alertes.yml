- date: "2026-09-21"
  heure: "20:17"
  type: alerte
  theme: eau
  titre: "Coupure du réseau du château d'eau du Chancel"
  resume: "Le réseau alimenté par le château d'eau du Chancel est fermé ce soir à partir de 20 h. Remise en service prévue demain à partir de 8 h 30."
  texte: |
    <p>Le réseau alimenté par le château d'eau du Chancel sera fermé ce soir à partir de 20 h. Nous vous demandons d'anticiper vos besoins en eau avant la coupure.</p>
    <p><strong>La remise en service est prévue demain à partir de 8 h 30.</strong></p>
    <p>Le château d'eau ne remontant pas suffisamment, nous vous tiendrons informés afin de vous préciser si cette fermeture devra être renouvelée les prochains jours ou si elle restera exceptionnelle.</p>
    <p>Merci à tous pour votre compréhension et votre vigilance.</p>
  en:
    titre: "Water network supplied by the Chancel water tower shut off"
    resume: "The network supplied by the Chancel water tower is shut off this evening from 20:00. Supply is expected to resume tomorrow from 8:30."
    texte: |
      <p>The network supplied by the Chancel water tower will be shut off this evening from 20:00. Please plan your water needs before the cut.</p>
      <p><strong>Supply is expected to resume tomorrow from 8:30.</strong></p>
      <p>As the water tower is not refilling sufficiently, we will keep you informed whether this shut-off needs to be repeated over the next few days or will remain exceptional.</p>
      <p>Thank you all for your understanding and vigilance.</p>
  nl:
    titre: "Afsluiting van het net van de watertoren van Chancel"
    resume: "Het net dat door de watertoren van Chancel wordt gevoed, is vanavond vanaf 20.00 uur afgesloten. Het water komt naar verwachting morgen vanaf 8.30 uur terug."
    texte: |
      <p>Het net dat door de watertoren van Chancel wordt gevoed, wordt vanavond vanaf 20.00 uur afgesloten. Zorg vóór de afsluiting voor het water dat u nodig hebt.</p>
      <p><strong>Het water komt naar verwachting morgen vanaf 8.30 uur terug.</strong></p>
      <p>Omdat de watertoren niet voldoende bijvult, laten we u weten of deze afsluiting de komende dagen moet worden herhaald of een uitzondering blijft.</p>
      <p>Iedereen bedankt voor het begrip en de waakzaamheid.</p>

- date: "2026-09-16"
  heure: "14:35"
  type: alerte
  theme: eau
  titre: "Coupure d'eau et travaux sur le réseau"
  resume: "Les coupures nocturnes sont maintenues. Ce soir, l'eau est coupée dès 21 h ; remise en eau demain après 9 h, une fois les travaux réalisés."
  texte: |
    <p>Suite à la fermeture de l'eau durant la nuit dernière, nous avons constaté que le niveau du château d'eau est bien remonté. À l'inverse, lorsque l'alimentation reste ouverte durant la nuit, le niveau ne remonte pas, ce qui laisse apparaître une consommation d'eau particulièrement importante pendant les heures nocturnes.</p>
    <p>Afin de préserver les réserves et de poursuivre nos recherches, les coupures nocturnes vont donc être maintenues.</p>
    <p><strong>Exceptionnellement ce soir, l'eau sera coupée à partir de 21 h.</strong> Des travaux étant programmés demain matin de bonne heure, la remise en eau n'interviendra qu'après 9 h, une fois les travaux réalisés.</p>
    <p>Nous vous tiendrons informés de la suite des opérations. Nous invitons une nouvelle fois chacun à faire preuve de la plus grande vigilance et à limiter au maximum sa consommation d'eau, afin de préserver les réserves disponibles.</p>
    <p>Merci à tous pour votre compréhension et votre coopération.</p>
  en:
    titre: "Water cut and work on the network"
    resume: "The night-time water cuts continue. Tonight, the water is cut from 21:00; supply resumes tomorrow after 9:00, once the work is done."
    texte: |
      <p>Following last night's water shut-off, we found that the level in the water tower had risen well. Conversely, when the supply stays open during the night, the level does not rise, which points to particularly high water consumption at night.</p>
      <p>To preserve the reserves and continue our investigations, the night-time cuts will therefore continue.</p>
      <p><strong>Exceptionally this evening, the water will be cut from 21:00.</strong> As work is planned early tomorrow morning, the water will only come back after 9:00, once the work has been done.</p>
      <p>We will keep you informed of the next steps. Once again, we ask everyone to be extremely vigilant and to limit their water consumption as much as possible, to preserve the available reserves.</p>
      <p>Thank you all for your understanding and cooperation.</p>
  nl:
    titre: "Wateronderbreking en werkzaamheden aan het net"
    resume: "De nachtelijke onderbrekingen blijven gelden. Vanavond wordt het water vanaf 21.00 uur afgesloten; het komt morgen na 9.00 uur terug, zodra de werkzaamheden klaar zijn."
    texte: |
      <p>Na de afsluiting van het water afgelopen nacht hebben we vastgesteld dat het niveau in de watertoren goed is gestegen. Blijft de toevoer ’s nachts open, dan stijgt het niveau niet, wat wijst op een bijzonder hoog waterverbruik ’s nachts.</p>
      <p>Om de voorraad te sparen en ons onderzoek voort te zetten, blijven de nachtelijke onderbrekingen dus gelden.</p>
      <p><strong>Vanavond wordt het water uitzonderlijk vanaf 21.00 uur afgesloten.</strong> Omdat er morgenvroeg werkzaamheden gepland zijn, komt het water pas na 9.00 uur terug, zodra de werkzaamheden klaar zijn.</p>
      <p>We houden u op de hoogte van het vervolg. We vragen iedereen opnieuw om heel waakzaam te zijn en het waterverbruik zoveel mogelijk te beperken, om de beschikbare voorraad te sparen.</p>
      <p>Iedereen bedankt voor het begrip en de medewerking.</p>

- date: "2026-09-15"
  heure: "16:32"
  type: alerte
  theme: eau
  titre: "Coupures d'eau nocturnes – château d'eau de Laurus"
  resume: "En raison d'une baisse très rapide du niveau du château d'eau de Laurus, l'eau est coupée chaque nuit de 20 h à 7 h jusqu'au retour à une situation normale."
  texte: |
    <p><strong>Communiqué officiel – restriction temporaire de l'alimentation en eau.</strong></p>
    <p>En raison d'une baisse très importante et particulièrement rapide du niveau du château d'eau de Laurus, la commune est contrainte de mettre en place des coupures nocturnes d'alimentation en eau.</p>
    <p><strong>À compter de ce soir, l'eau sera coupée à partir de 20 h et remise en service à 7 h le lendemain matin.</strong> Cette mesure sera reconduite chaque nuit, jusqu'au retour à une situation normale, afin d'éviter la vidange complète du château d'eau et de préserver au maximum les réserves disponibles.</p>
    <p>Nous demandons à l'ensemble des usagers concernés de prendre toutes les dispositions nécessaires avant 20 h et d'anticiper leurs besoins en eau pour la nuit. Dans le contexte actuel, toute consommation non indispensable doit impérativement être évitée.</p>
    <p>La commune remercie chacun pour sa compréhension, sa vigilance et le strict respect de ces consignes.</p>
  en:
    titre: "Night-time water cuts – Laurus water tower"
    resume: "Because the level of the Laurus water tower is falling very fast, the water is cut every night from 20:00 to 7:00 until the situation returns to normal."
    texte: |
      <p><strong>Official notice – temporary restriction of the water supply.</strong></p>
      <p>Because the level of the Laurus water tower has fallen very sharply and particularly quickly, the municipality has to introduce night-time cuts to the water supply.</p>
      <p><strong>From this evening, the water will be cut from 20:00 and restored at 7:00 the following morning.</strong> This measure will be repeated every night until the situation returns to normal, to prevent the water tower from emptying completely and to preserve the available reserves as much as possible.</p>
      <p>We ask all users concerned to make all the necessary arrangements before 20:00 and to plan their water needs for the night. In the current situation, any non-essential water use must absolutely be avoided.</p>
      <p>The municipality thanks everyone for their understanding, their vigilance and their strict compliance with these instructions.</p>
  nl:
    titre: "Nachtelijke wateronderbrekingen – watertoren van Laurus"
    resume: "Omdat het niveau van de watertoren van Laurus zeer snel daalt, wordt het water elke nacht afgesloten van 20.00 tot 7.00 uur, tot de situatie weer normaal is."
    texte: |
      <p><strong>Officieel bericht – tijdelijke beperking van de watertoevoer.</strong></p>
      <p>Door een zeer sterke en bijzonder snelle daling van het niveau van de watertoren van Laurus moet de gemeente de watertoevoer ’s nachts onderbreken.</p>
      <p><strong>Vanaf vanavond wordt het water vanaf 20.00 uur afgesloten en de volgende ochtend om 7.00 uur weer opengezet.</strong> Deze maatregel wordt elke nacht herhaald tot de situatie weer normaal is, om te voorkomen dat de watertoren helemaal leegloopt en om de beschikbare voorraad zoveel mogelijk te sparen.</p>
      <p>We vragen alle betrokken gebruikers om vóór 20.00 uur de nodige voorzorgen te nemen en te zorgen voor het water dat ze ’s nachts nodig hebben. In de huidige omstandigheden moet elk niet-noodzakelijk verbruik absoluut worden vermeden.</p>
      <p>De gemeente dankt iedereen voor het begrip, de waakzaamheid en het strikt naleven van deze richtlijnen.</p>

- date: "2026-09-15"
  type: info
  theme: eau
  titre: "Rappel aux agriculteurs : consommation d'eau"
  resume: "Consommation au strict nécessaire, abreuvement compris. Il est interdit de remplir des cuves au réseau communal ; le point d'eau du Frayssinet reste à disposition."
  texte: |
    <p>Compte tenu de la situation actuelle sur le réseau d'eau, nous rappelons qu'il est <strong>indispensable</strong> que chacun <strong>limite au strict nécessaire</strong> sa consommation, y compris pour l'abreuvement des animaux.</p>
    <p><strong>Il est strictement interdit de remplir des cuves avec l'eau provenant du réseau communal.</strong> Pour vos besoins, le point d'eau du Frayssinet reste à votre disposition.</p>
    <p>Des rondes de surveillance et des contrôles seront effectués. En cas d'abus ou de non-respect de ces consignes, la commune se verra dans l'obligation de prendre les mesures nécessaires et, le cas échéant, de sanctionner les comportements constatés.</p>
    <p>Merci à chacun de faire preuve de responsabilité afin de préserver au maximum les réserves d'eau.</p>
  en:
    titre: "Reminder to farmers: water consumption"
    resume: "Use water only for essential needs, including watering livestock. Filling tanks from the municipal network is forbidden; the Frayssinet water point remains available."
    texte: |
      <p>Given the current situation on the water network, we remind everyone that it is <strong>essential</strong> to <strong>limit water use to what is strictly necessary</strong>, including for watering animals.</p>
      <p><strong>It is strictly forbidden to fill tanks with water from the municipal network.</strong> For your needs, the Frayssinet water point remains available to you.</p>
      <p>Patrols and checks will be carried out. In the event of abuse or failure to follow these instructions, the municipality will be obliged to take the necessary measures and, where appropriate, to penalise the behaviour observed.</p>
      <p>We thank everyone for acting responsibly to preserve the water reserves as much as possible.</p>
  nl:
    titre: "Herinnering voor landbouwers: waterverbruik"
    resume: "Verbruik alleen het strikt noodzakelijke, ook voor het drenken van vee. Tanks vullen met water van het gemeentelijke net is verboden; het watertappunt van Frayssinet blijft beschikbaar."
    texte: |
      <p>Gezien de huidige situatie op het waternet herinneren we eraan dat het <strong>absoluut noodzakelijk</strong> is dat iedereen zijn verbruik <strong>tot het strikt noodzakelijke beperkt</strong>, ook voor het drenken van de dieren.</p>
      <p><strong>Het is strikt verboden tanks te vullen met water van het gemeentelijke net.</strong> Voor uw behoeften blijft het watertappunt van Frayssinet tot uw beschikking.</p>
      <p>Er worden controlerondes en controles uitgevoerd. Bij misbruik of niet-naleving van deze richtlijnen zal de gemeente de nodige maatregelen moeten nemen en zo nodig het vastgestelde gedrag bestraffen.</p>
      <p>We danken iedereen voor zijn verantwoordelijkheidsgevoel om de watervoorraad zoveel mogelijk te sparen.</p>

- date: "2026-09-13"
  type: info
  theme: eau
  titre: "Fuite d'eau : merci de limiter votre consommation"
  resume: "La fuite sur le réseau du château d'eau de Laurus est localisée et sera réparée demain. Les habitants du bourg sont invités à réduire au maximum leur consommation."
  texte: |
    <p>La fuite sur le réseau du château d'eau de Laurus a été localisée. <strong>Elle ne pourra malheureusement être réparée que demain.</strong></p>
    <p>En attendant, nous demandons à tous les habitants du bourg de réduire au maximum leur consommation d'eau aujourd'hui. Cette vigilance est essentielle pour permettre au château d'eau de retrouver un niveau suffisant, et aux habitants situés sur la conduite entre la mairie et le Lessard de retrouver l'eau le plus rapidement possible dès que la fuite sera réparée.</p>
    <p>Chaque économie d'eau compte. Merci à tous pour votre compréhension et votre coopération.</p>
  en:
    titre: "Water leak: please limit your water use"
    resume: "The leak on the Laurus water tower network has been located and will be repaired tomorrow. Residents of the village centre are asked to reduce their water use as much as possible."
    texte: |
      <p>The leak on the Laurus water tower network has been located. <strong>Unfortunately, it cannot be repaired until tomorrow.</strong></p>
      <p>In the meantime, we ask all residents of the village centre to reduce their water use as much as possible today. This vigilance is essential to allow the water tower to recover a sufficient level, and to allow residents on the pipe between the town hall and Le Lessard to get their water back as quickly as possible once the leak has been repaired.</p>
      <p>Every drop saved counts. Thank you all for your understanding and cooperation.</p>
  nl:
    titre: "Waterlek: beperk uw verbruik"
    resume: "Het lek in het net van de watertoren van Laurus is gevonden en wordt morgen hersteld. De inwoners van het dorpscentrum wordt gevraagd hun verbruik zoveel mogelijk te beperken."
    texte: |
      <p>Het lek in het net van de watertoren van Laurus is gevonden. <strong>Helaas kan het pas morgen worden hersteld.</strong></p>
      <p>Intussen vragen we alle inwoners van het dorpscentrum om vandaag zo weinig mogelijk water te verbruiken. Die waakzaamheid is essentieel om de watertoren weer voldoende te laten vollopen, en om de inwoners langs de leiding tussen het gemeentehuis en Le Lessard zo snel mogelijk weer water te geven zodra het lek is hersteld.</p>
      <p>Elke druppel telt. Iedereen bedankt voor het begrip en de medewerking.</p>

- date: "2026-09-12"
  type: info
  theme: eau
  titre: "Fuite sur le château d'eau de Laurus"
  resume: "Une fuite fait fortement baisser le niveau du château d'eau de Laurus. Intervention cet après-midi ; des coupures d'eau sont possibles."
  texte: |
    <p><strong>Alerte eau – information importante pour les habitants.</strong> Une fuite a été constatée sur le château d'eau de Laurus. Le niveau d'eau baisse fortement et le réseau est actuellement perturbé.</p>
    <p>Tous les habitants du bourg et ceux desservis par Laurus sont invités à faire très attention à leur consommation d'eau et à la limiter au maximum.</p>
    <p>Des personnes vont intervenir sur le réseau cet après-midi afin de rechercher la fuite et de rétablir le réseau à la normale le plus rapidement possible. <strong>Des coupures d'eau peuvent avoir lieu le temps de l'intervention.</strong></p>
    <p>Merci à tous pour votre patience, votre vigilance et votre solidarité.</p>
  en:
    titre: "Leak at the Laurus water tower"
    resume: "A leak is making the level of the Laurus water tower drop sharply. Work will be carried out this afternoon; water cuts are possible."
    texte: |
      <p><strong>Water alert – important information for residents.</strong> A leak has been found at the Laurus water tower. The water level is dropping sharply and the network is currently disrupted.</p>
      <p>All residents of the village centre and those supplied by Laurus are asked to be very careful with their water use and to limit it as much as possible.</p>
      <p>A team will work on the network this afternoon to find the leak and restore the network to normal as quickly as possible. <strong>Water cuts may occur during the work.</strong></p>
      <p>Thank you all for your patience, vigilance and solidarity.</p>
  nl:
    titre: "Lek bij de watertoren van Laurus"
    resume: "Door een lek daalt het niveau van de watertoren van Laurus sterk. Vanmiddag wordt eraan gewerkt; wateronderbrekingen zijn mogelijk."
    texte: |
      <p><strong>Waterwaarschuwing – belangrijke informatie voor de inwoners.</strong> Bij de watertoren van Laurus is een lek vastgesteld. Het waterniveau daalt sterk en het net is momenteel verstoord.</p>
      <p>Alle inwoners van het dorpscentrum en wie door Laurus van water wordt voorzien, worden gevraagd heel zuinig met water om te gaan en het verbruik zoveel mogelijk te beperken.</p>
      <p>Vanmiddag gaan er mensen aan het net werken om het lek te zoeken en het net zo snel mogelijk weer normaal te laten werken. <strong>Tijdens de werkzaamheden kan het water worden onderbroken.</strong></p>
      <p>Iedereen bedankt voor het geduld, de waakzaamheid en de solidariteit.</p>

- date: "2026-09-07"
  type: info
  theme: eau
  titre: "Règlement des factures d'eau"
  resume: "Les chèques ne sont plus acceptés pour régler les factures d'eau. Prélèvement automatique, carte bancaire ou virement."
  texte: |
    <p><strong>Les chèques ne sont plus acceptés pour le règlement des factures d'eau.</strong></p>
    <p>Pour être prélevé, apportez vos papiers à la mairie avant le 30 septembre 2026 :</p>
    <ul>
      <li>un relevé d'identité bancaire (RIB) à votre nom ;</li>
      <li>une pièce d'identité ;</li>
      <li>un justificatif de domicile (si besoin).</li>
    </ul>
    <p>Si vous ne souhaitez pas de prélèvement, vous pouvez régler vos factures d'eau par carte bancaire ou par virement.</p>
  en:
    titre: "Paying water bills"
    resume: "Cheques are no longer accepted for paying water bills. Direct debit, bank card or bank transfer."
    texte: |
      <p><strong>Cheques are no longer accepted for paying water bills.</strong></p>
      <p>To pay by direct debit, bring the following to the town hall before 30 September 2026:</p>
      <ul>
        <li>your bank details (RIB) in your name;</li>
        <li>an identity document;</li>
        <li>proof of address (if needed).</li>
      </ul>
      <p>If you do not want to pay by direct debit, you can pay your water bills by bank card or by bank transfer.</p>
  nl:
    titre: "Betaling van de waterrekeningen"
    resume: "Cheques worden niet meer geaccepteerd voor de betaling van waterrekeningen. Automatische incasso, bankpas of overboeking."
    texte: |
      <p><strong>Cheques worden niet meer geaccepteerd voor de betaling van de waterrekeningen.</strong></p>
      <p>Voor een automatische incasso brengt u vóór 30 september 2026 naar het gemeentehuis:</p>
      <ul>
        <li>uw bankgegevens (RIB) op uw naam;</li>
        <li>een identiteitsbewijs;</li>
        <li>een bewijs van woonadres (indien nodig).</li>
      </ul>
      <p>Wilt u geen automatische incasso, dan kunt u uw waterrekeningen betalen met uw bankpas of per overboeking.</p>

