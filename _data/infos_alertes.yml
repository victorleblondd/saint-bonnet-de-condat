  type: info
  theme: eau
  titre: "Château d'eau de Réghéat"
  resume: "Le château d'eau de Réghéat vient d'être rempli : il est déconseillé de boire l'eau au moins jusqu'à demain."
  texte: |
    <p><strong>Le château d'eau de Réghéat vient d'être rempli. Il est déconseillé de boire l'eau, au moins jusqu'à demain</strong> : elle peut encore être trouble suite au remplissage.</p>
    <p>Si besoin, des bouteilles d'eau sont disponibles en les demandant à Nathalie.</p>
    <p>Merci de votre compréhension. — La mairie</p>
