  type: info
  theme: eau
  titre: "Fuite sur le château d'eau de Laurus"
  resume: "Une fuite fait fortement baisser le niveau du château d'eau de Laurus. Intervention cet après-midi ; des coupures d'eau sont possibles."
  texte: |
    <p><strong>Alerte eau – information importante pour les habitants.</strong> Une fuite a été constatée sur le château d'eau de Laurus. Le niveau d'eau baisse fortement et le réseau est actuellement perturbé.</p>
    <p>Tous les habitants du bourg et ceux desservis par Laurus sont invités à faire très attention à leur consommation d'eau et à la limiter au maximum.</p>
    <p>Des personnes vont intervenir sur le réseau cet après-midi afin de rechercher la fuite et de rétablir le réseau à la normale le plus rapidement possible. <strong>Des coupures d'eau peuvent avoir lieu le temps de l'intervention.</strong></p>
    <p>Merci à tous pour votre patience, votre vigilance et votre solidarité.</p>

