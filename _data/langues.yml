# =====================================================================
#  LANGUES DU SITE : français (langue principale), anglais et néerlandais
#
#  - Les pages françaises gardent leurs adresses ; les versions anglaises
#    sont sous /en/, les néerlandaises sous /nl/.
#  - Chaque page porte dans son front matter « lang » (fr, en ou nl) et « ref » :
#    les trois versions d'une même page ont la même « ref » (c'est ce qui relie
#    les liens « Français · English · Nederlands » du haut de chaque page).
#  - Ce fichier contient les textes de l'interface (menus, boutons, pied de page…)
#    dans chaque langue. Les textes des actualités sont dans _data/infos_alertes.yml
#    (rubriques en: et nl: de chaque actualité).
# =====================================================================

# Ordre des langues dans le sélecteur
ordre: [fr, en, nl]

# Bandeau qui propose la version dans la langue du visiteur (chaque texte dans sa propre langue)
suggestions:
  fr:
    texte: "Cette page existe aussi en français."
    lien: "Lire en français"
    fermer: "Non merci"
    region: "Choix de la langue"
  en:
    texte: "This page is also available in English."
    lien: "Read in English"
    fermer: "No thanks"
    region: "Language choice"
  nl:
    texte: "Deze pagina is ook beschikbaar in het Nederlands."
    lien: "Lees in het Nederlands"
    fermer: "Nee, bedankt"
    region: "Taalkeuze"

