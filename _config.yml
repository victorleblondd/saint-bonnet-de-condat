# Site officiel de la commune de Saint-Bonnet-de-Condat (Cantal)
# Publié avec GitHub Pages (Jekyll). Voir README.md pour la mise à jour.

title: "Saint-Bonnet-de-Condat"
description: "Site officiel de la commune de Saint-Bonnet-de-Condat (Cantal, 15190) : mairie, infos et alertes, vie pratique, vie locale et patrimoine."
lang: fr-FR
locale: fr_FR

# Adresse du site : le nom de domaine de la commune (relié par le fichier CNAME).
url: "https://saint-bonnet-de-condat.fr"
baseurl: ""

timezone: Europe/Paris
encoding: utf-8

# Les articles du bulletin municipal (dossier _posts) sont publiés sous /bulletin-municipal/nom-de-l-article/
permalink: /bulletin-municipal/:title/

# Notifications sur téléphone (page /notifications/) : valeurs publiques uniquement.
# Les clés secrètes sont dans les secrets GitHub du dépôt (SUPABASE_SECRET_KEY, VAPID_PRIVATE_KEY).
notifications:
  cle_vapid: "BB_rgFigOgTZJo7yWb5tEg8BBQyVf03nwRMt8E47knM-6ro69PbQh_ZDRZnqNHyMR8BLIf3MwSDuEbcyMTFasY0"
  supabase_url: "https://luybdwrmpzmpvkwddbha.supabase.co"
  supabase_cle: "sb_publishable_74_5ITQasjnVJHQbt754Hg_X13bLZpu"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - outils
