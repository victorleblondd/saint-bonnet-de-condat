---
layout: default
---
{%- assign t = site.data.langues[page.lang] | default: site.data.langues.fr -%}
<div class="entete-page">
  <div class="conteneur">
    <nav class="fil-ariane" aria-label="{{ t.fil_ariane }}">
      <ol>
        <li><a href="{{ t.pages.accueil | relative_url }}">{{ t.accueil }}</a></li>
        <li><span aria-current="page">{{ page.title }}</span></li>
      </ol>
    </nav>
    <h1>{{ page.title }}</h1>
    {%- if page.chapo %}
    <p class="chapo">{{ page.chapo }}</p>
    {%- endif %}
  </div>
</div>
<div class="conteneur corps-page">
{{ content }}
</div>
